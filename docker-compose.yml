services:
  tradingagents:
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://kauppaagentit:kauppaagentit@postgres:5432/kauppaagentit
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - postgres
      - redis
    tty: true
    stdin_open: true

  autotrader-worker:
    build: .
    command: ["python", "-m", "autotrader.scheduler"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://kauppaagentit:kauppaagentit@postgres:5432/kauppaagentit
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    profiles:
      - autotrader

  telegram-bot:
    build: .
    command: ["python", "-m", "telegram_bot.bot"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://kauppaagentit:kauppaagentit@postgres:5432/kauppaagentit
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    profiles:
      - bot

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=kauppaagentit
      - POSTGRES_USER=kauppaagentit
      - POSTGRES_PASSWORD=kauppaagentit
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kauppaagentit -d kauppaagentit"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
  postgres_data:
  redis_data:
